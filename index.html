<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SSB Practice</title>

<style>
  body { font-family: Arial, sans-serif; background: #f2f4ee; text-align: center; margin: 0; padding: 15px; }
  h1 { color: #3d5a2a; }
  button { padding: 10px 14px; margin: 4px; font-size: 16px; border: none; border-radius: 8px; background: #3d5a2a; color: white; }
  #box { background: white; border-radius: 12px; padding: 20px; margin: 15px auto; max-width: 500px; min-height: 220px; }
  #title { color: #3d5a2a; font-weight: bold; }
  #content { font-size: 32px; margin: 15px 0; }
  #timer { font-size: 50px; font-weight: bold; }
  img { max-width: 100%; max-height: 250px; }
</style>
</head>

<body>
  <h1>SSB Practice</h1>

  <!-- Test buttons -->
  <button onclick="startTest('ppdt')">PPDT</button>
  <button onclick="startTest('tat')">TAT</button>
  <button onclick="startTest('wat')">WAT</button>
  <button onclick="startTest('lecturette')">Lecturette</button>

  <!-- Where everything is shown -->
  <div id="box">
    <div id="title">Choose a test</div>
    <div id="content"></div>
    <div id="timer"></div>
  </div>

  <!-- Control buttons -->
  <button onclick="pauseOrResume()">Pause / Resume</button>
  <button onclick="nextStep()">Skip</button>

<script>
  // ---------- 1. YOUR DATA (edit freely) ----------

  var words = ["Mother", "Duty", "Fear", "Failure", "Army", "Win", "Friend", "Leader",
    "Courage", "Team", "Defeat", "Money", "Danger", "Sacrifice", "Discipline", "Father",
    "Brave", "Enemy", "Help", "Hope", "Pressure", "Honest", "Group", "Lazy", "Order",
    "Risk", "Anger", "Success", "Weak", "Strong", "Dream", "Nation", "Fight", "Trust",
    "Cheat", "Patience", "Effort", "War", "Love", "Ambition", "Responsibility", "Sports",
    "Crisis", "Fail", "Lead", "Care", "Cry", "Alone", "Quarrel", "Tired", "Hard",
    "Sorrow", "Selfish", "Rules", "Wound", "Decision", "Future", "Peace", "Worry", "Respect"];

  var topics = ["Cyber security", "Role of NCC", "Climate change", "Women in armed forces",
    "Make in India", "Youth unemployment", "Discipline", "Space programme",
    "Social media", "Disaster management", "Digital India", "Water scarcity"];

  // Pictures: put pic1.jpg, pic2.jpg ... in a folder named "images"

  // ---------- 2. TIMINGS in seconds (edit freely) ----------

  var viewTime = 30;      // PPDT / TAT picture viewing
  var writeTime = 240;    // PPDT / TAT writing (4 minutes)
  var wordTime = 15;      // WAT, per word
  var prepTime = 180;     // Lecturette preparation
  var speakTime = 180;    // Lecturette speaking

  // ---------- 3. VARIABLES the program remembers ----------

  var steps = [];         // list of steps for the chosen test
  var current = 0;        // which step we are on
  var secondsLeft = 0;    // countdown
  var timer = null;       // the running clock
  var paused = false;

  // ---------- 4. BUILD THE STEPS ----------

  // Each step = a title, something to show, and how many seconds.
  function addStep(title, content, seconds) {
    steps.push({ title: title, content: content, seconds: seconds });
  }

  function pictureHtml(number) {
    return '<img src="images/pic' + number + '.jpg" alt="Add images/pic' + number + '.jpg">';
  }

  function startTest(name) {
    steps = [];
    current = 0;

    if (name == "ppdt") {
      var n = Math.floor(Math.random() * 11) + 1;   // random picture 1-11
      addStep("PPDT: Look at the picture", pictureHtml(n), viewTime);
      addStep("PPDT: Write your story", "Write now", writeTime);
    }

    if (name == "tat") {
      for (var n = 1; n <= 11; n++) {
        addStep("TAT " + n + "/12: Look", pictureHtml(n), viewTime);
        addStep("TAT " + n + "/12: Write", "Write story " + n, writeTime);
      }
      addStep("TAT 12/12: Blank slide", "Imagine your own scene", viewTime);
      addStep("TAT 12/12: Write", "Write story 12", writeTime);
    }

    if (name == "wat") {
      var shuffled = words.slice().sort(function () { return Math.random() - 0.5; });
      for (var i = 0; i < shuffled.length; i++) {
        addStep("WAT: Word " + (i + 1) + "/" + shuffled.length, shuffled[i], wordTime);
      }
    }

    if (name == "lecturette") {
      var four = topics.slice().sort(function () { return Math.random() - 0.5; }).slice(0, 4);
      addStep("Lecturette: Choose one topic and prepare", four.join("<br>"), prepTime);
      addStep("Lecturette: Speak now", "Start your talk", speakTime);
    }

    showStep();
  }

  // ---------- 5. SHOW A STEP AND RUN THE CLOCK ----------

  function showStep() {
    clearInterval(timer);

    if (current >= steps.length) {          // no more steps
      document.getElementById("title").innerHTML = "Time up!";
      document.getElementById("content").innerHTML = "Test complete";
      document.getElementById("timer").innerHTML = "";
      return;
    }

    var step = steps[current];
    document.getElementById("title").innerHTML = step.title;
    document.getElementById("content").innerHTML = step.content;
    secondsLeft = step.seconds;
    paused = false;
    showTime();
    timer = setInterval(tick, 1000);        // run tick() every 1 second
  }

  function tick() {
    secondsLeft = secondsLeft - 1;
    showTime();
    if (secondsLeft <= 0) {
      beep();
      nextStep();
    }
  }

  function showTime() {
    var minutes = Math.floor(secondsLeft / 60);
    var seconds = secondsLeft % 60;
    if (seconds < 10) { seconds = "0" + seconds; }
    document.getElementById("timer").innerHTML = minutes + ":" + seconds;
  }

  function nextStep() {
    current = current + 1;
    showStep();
  }

  function pauseOrResume() {
    if (current >= steps.length) { return; }
    if (paused) {
      timer = setInterval(tick, 1000);
      paused = false;
    } else {
      clearInterval(timer);
      paused = true;
    }
  }

  // ---------- 6. SOUND ----------

  function beep() {
    var audio = new (window.AudioContext || window.webkitAudioContext)();
    var sound = audio.createOscillator();
    sound.connect(audio.destination);
    sound.start();
    sound.stop(audio.currentTime + 0.3);
  }
</script>
</body>
</html>
